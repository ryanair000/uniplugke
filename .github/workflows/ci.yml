name: CI

on:
  push:
    branches: [main, phase-1-foundation, phase-2-member-operations]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, privacy test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          : > ci-output.log
          npm install --no-audit --no-fund 2>&1 | tee -a ci-output.log
      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a ci-output.log
      - name: Preserve quality output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-quality-output
          path: ci-output.log
          if-no-files-found: error
          retention-days: 3
