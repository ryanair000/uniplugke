name: CI

on:
  push:
    branches: [main, phase-1-foundation, phase-2-member-operations, fix/phase-2-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-source:
    name: Package live source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/uniplug-live-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: uniplug-live-source
          path: /tmp/uniplug-live-source.tgz
          retention-days: 1
          if-no-files-found: error

  quality:
    name: Lint, type-check, source invariants, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          : > ci-output.log
          npm ci --no-audit --no-fund 2>&1 | tee -a ci-output.log
      - name: Run complete quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a ci-output.log
      - name: Preserve quality output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-quality-output
          path: ci-output.log
          if-no-files-found: error
          retention-days: 3

  database:
    name: Migrations, RLS, RPC privileges, and idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Run pgTAP database tests
        run: supabase test db
