name: Package source for deployment

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: |
          zip -r uniplug-source.zip . \
            -x '.git/*' 'node_modules/*' '.next/*' 'uniplug-source.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: uniplug-source
          path: uniplug-source.zip
          retention-days: 1
