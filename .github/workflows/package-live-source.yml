name: Package live source

on:
  push:
    branches:
      - fix/phase-2-hardening

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/uniplug-live-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: uniplug-live-source
          path: /tmp/uniplug-live-source.tgz
          retention-days: 1
          if-no-files-found: error
